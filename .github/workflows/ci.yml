name: Test and verify

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Compile Python modules
        run: python -m compileall -q agents protein_lm_agent cli.py enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q
      - name: Smoke-test package CLI
        run: |
          protein-language-model-esm-agent audit --task-id CI-SMOKE --primary 12 --secondary 2 --status NOMINAL
          protein-lm-frontier audit --task-id CI-FRONTIER --primary 12 --secondary 2 --status NOMINAL
