[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "protein-language-model-esm-engine"
version = "2.0.0"
description = "ProteinLM-Embedding: Masked Language Model Perplexity & Mutational Fitness Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
protein-language-model-esm-engine = "protein_lm_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/protein-language-model-esm-engine"
Repository = "https://github.com/abusuraihsakhri/protein-language-model-esm-engine.git"
